
name: Verificar codigo Python

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verificar-python:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar sintaxis Python
        run: |
          python -m py_compile simulador/sensor.py
          python -m py_compile simulador/config.py
          python -m py_compile simulador/mqtt_cliente.py
