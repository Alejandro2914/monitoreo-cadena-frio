

name: Verificar Terraform

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar-terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Verificar formato
        run: terraform fmt -check

      - name: Inicializar Terraform
        run: terraform init -backend=false -lockfile=readonly

      - name: Validar configuracion
        run: terraform validate

  probar-lambda:
    name: Probar deduplicacion Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install "boto3>=1.40,<2"

      - name: Ejecutar pruebas unitarias
        run: python lambda/test_procesar_lectura.py -v
