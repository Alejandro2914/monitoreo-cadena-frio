

name: Verificar autenticacion AWS OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verificar-oidc:
    name: Comprobar identidad AWS
    runs-on: ubuntu-latest
    environment: production

    steps:
      # NUEVO: Comprobamos la identidad del token
      - name: Diagnosticar identidad OIDC
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          url += separator + urllib.parse.urlencode({
              "audience": "sts.amazonaws.com"
          })

          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}"}
          )

          with urllib.request.urlopen(request) as response:
              identity_token = json.load(response)["value"]

          payload = identity_token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("Audience:", claims.get("aud"))
          print("Subject:", claims.get("sub"))
          PY

      # EXISTENTE: Intentamos asumir el rol de AWS
      - name: Configurar credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::619071328452:role/github-actions-terraform-role
          aws-region: us-east-2
          role-session-name: prueba-oidc-github

      # EXISTENTE: Comprobamos la identidad AWS
      - name: Comprobar identidad
        run: aws sts get-caller-identity
