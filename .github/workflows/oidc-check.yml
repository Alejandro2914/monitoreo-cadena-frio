


name: Verificar autenticacion AWS OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verificar-oidc:
    name: Comprobar identidad AWS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configurar credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::619071328452:role/github-actions-terraform-role
          aws-region: us-east-2
          role-session-name: prueba-oidc-github

      - name: Comprobar identidad
        run: aws sts get-caller-identity

      - name: Verificar acceso al estado remoto S3
        run: |
          aws s3api list-objects-v2 \
            --bucket monitoreo-cadena-frio-tfstate-619071328452 \
            --prefix cadena-frio/terraform.tfstate \
            --max-keys 1

          echo "Acceso de lectura/listado S3 verificado"

      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Inicializar backend remoto S3
        working-directory: terraform
        run: terraform init -input=false

      - name: Generar plan de infraestructura
        working-directory: terraform
        run: terraform plan -input=false -no-color